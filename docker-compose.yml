x-app-env: &app-env
  DATABASE_URL: postgres://assets:assets@db:5432/assets
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_DEBUG: "1"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assets
      POSTGRES_USER: assets
      POSTGRES_PASSWORD: assets
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets -d assets"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    # -B embeds Celery Beat in the worker (fine for one worker; split it out if scaled).
    command: celery -A config worker -B -l info --schedule /tmp/celerybeat-schedule
    environment: *app-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
